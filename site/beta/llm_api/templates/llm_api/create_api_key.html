<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Create a Theatre API key</title>
</head>
<body>
    <h1>Create a Theatre API key</h1>
    {% if generated_key %}
        <p>
            Key for {{ generated_user }}. Copy it now; it will not be shown again.
        </p>
        <p><code>{{ generated_key }}</code></p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create key</button>
    </form>
</body>
</html>
