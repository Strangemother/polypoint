<body>
    <h1>Polypoint Theatre API</h1>
    <p>Send URL-encoded requests to <code>POST /llm_api/theatres/</code>.</p>
    <p>MCP clients: Streamable HTTP at <code>{% url 'llm_api:mcp' %}</code>, with <code>Authorization: Bearer &lt;key&gt;</code>.</p>
    <p><a href="{% url 'llm_api:create_api_key' %}">Create an API key as a staff user</a></p>
</body>
